server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Directory mount, not a single-file mount: git pull replaces the file's inode, which a file mount never sees
    location = /repos.json {
        alias /srv/repo/repos.json;
        add_header Cache-Control no-cache;
    }

    location /projects.json {
        add_header Content-Type application/json;
    }

    location /api/ {
        proxy_pass http://dashboard-api:5001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
